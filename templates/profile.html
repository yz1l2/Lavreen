<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفي الشخصي - لافريين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 p-6">
    <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-md border border-gray-100">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold">متجري الشخصي ✦</h1>
            <a href="/" class="text-sm bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-xl transition">الرئيسية</a>
        </div>

        <!-- عرض بيانات المستخدم -->
        <div class="mb-6 bg-gray-50 p-4 rounded-xl border">
            <p class="text-gray-500 text-sm">اسم المتجر / المستخدم:</p>
            <p class="text-xl font-bold text-gray-800 mb-3">{{ user['name'] }}</p>

            <p class="text-gray-500 text-sm">رقم الهاتف:</p>
            <p class="text-lg font-semibold text-gray-800 mb-3">{{ user['phone'] or 'لم يتم إضافته بعد' }}</p>

            <p class="text-gray-500 text-sm">نبذة عن المتجر (البايو):</p>
            <p class="text-gray-700">{{ user['bio'] or 'لا توجد نبذة حالياً...' }}</p>
        </div>

        <!-- نموذج تعديل البيانات (يشمل الاسم، الهاتف، والبايو) -->
        <form action="/update-profile" method="POST" class="space-y-4">
            <h3 class="font-bold text-lg border-b pb-2">تعديل بيانات المتجر</h3>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">اسم المتجر</label>
                <input type="text" name="name" value="{{ user['name'] }}" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-black" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">رقم الهاتف</label>
                <input type="text" name="phone" value="{{ user['phone'] or '' }}" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-black" placeholder="05xxxxxxxx">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">بايو المتجر (نبذة)</label>
                <textarea name="bio" rows="3" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-black" placeholder="اكتب نبذة مختصرة عن متجرك...">{{ user['bio'] or '' }}</textarea>
            </div>

            <button type="submit" class="w-full bg-black text-white p-3 rounded-xl font-bold hover:bg-gray-800 transition">حفظ التعديلات</button>
        </form>
    </div>
</body>
</html>
