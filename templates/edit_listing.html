<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعديل الإعلان - لافريين</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="listing-page">

    <div class="listing-container">

        <div class="listing-card">

            <h1 class="listing-title">
                تعديل الإعلان
            </h1>

            <form method="POST"
                  enctype="multipart/form-data">

                <div class="form-group">

                    <label>عنوان الإعلان</label>

                    <input
                        type="text"
                        name="title"
                        value="{{ listing['title'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>القسم</label>

                    <input
                        type="text"
                        name="category"
                        value="{{ listing['category'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>السعر</label>

                    <input
                        type="number"
                        name="price"
                        value="{{ listing['price'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>المدينة</label>

                    <input
                        type="text"
                        name="city"
                        value="{{ listing['city'] }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>الوصف</label>

                    <textarea
                        name="description"
                        rows="6"
                    >{{ listing['description'] or '' }}</textarea>

                </div>


                <div class="form-group">

                    <label>إضافة صور جديدة</label>

                    <input
                        type="file"
                        name="images"
                        accept="image/*"
                        multiple
                    >

                    <small>
                        يمكنك إضافة حتى 30 صورة.
                    </small>

                </div>


                <div class="form-group">

                    <label>إضافة فيديوهات جديدة</label>

                    <input
                        type="file"
                        name="videos"
                        accept="video/*"
                        multiple
                    >

                    <small>
                        يمكنك إضافة حتى 5 فيديوهات.
                    </small>

                </div>


                <button
                    type="submit"
                    class="sell-button"
                >
                    حفظ التعديلات
                </button>

            </form>

        </div>

    </div>

</main>
<!-- شريط التنقل السفلي الخاص بالجوالات -->
