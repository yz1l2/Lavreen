<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الإعلان | لافريين</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        .edit-page {
            max-width: 640px;
            margin: auto;
            padding: 60px 20px;
        }

        .edit-page h1 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .edit-box {
            background: white;
            border: 1px solid #e5e6eb;
            border-radius: 22px;
            padding: 25px;
        }

        .form-row {
            margin-bottom: 16px;
        }

        .form-row label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
            color: #444;
        }

        .form-row input,
        .form-row select,
        .form-row textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .form-row textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .save-btn {
            width: 100%;
            border: 0;
            padding: 15px;
            border-radius: 13px;
            background: linear-gradient(135deg, #7357ff, #6045ed);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 8px;
        }

        .cancel-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            color: #888;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="/" class="logo">
            <span class="logo-text" style="color:var(--purple);">LAVREEN</span>
        </a>
        <nav class="main-nav">
            <a href="/">الرئيسية</a>
            <a href="/ai">✨ مساعد AI</a>
        </nav>
        <div class="header-actions">
            <a href="/my-listings" class="header-link">إعلاناتي</a>
        </div>
    </div>
</header>

<main class="edit-page">
    <h1>تعديل الإعلان</h1>

    <div class="edit-box">
        <form method="POST" action="{{ url_for('edit_listing', listing_id=listing['id']) }}">

            <div class="form-row">
                <label>عنوان الإعلان</label>
                <input type="text" name="title" value="{{ listing['title'] }}" required>
            </div>

            <div class="form-row">
                <label>التصنيف</label>
                <select name="category">
                    {% for cat in ['سيارات', 'جوالات', 'عقار', 'كمبيوتر', 'أثاث'] %}
                    <option value="{{ cat }}" {% if listing['category'] == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label>السعر (ريال)</label>
                    <input type="number" name="price" value="{{ listing['price']|int }}" required>
                </div>
                <div class="form-row">
                    <label>المدينة</label>
                    <input type="text" name="city" value="{{ listing['city'] }}" required>
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label>سنة الصنع (اختياري)</label>
                    <input type="number" name="year" value="{{ listing['year'] or '' }}">
                </div>
                <div class="form-row">
                    <label>الممشى / كم (اختياري)</label>
                    <input type="number" name="mileage" value="{{ listing['mileage'] or '' }}">
                </div>
            </div>

            <div class="form-grid-2">
                <div class="form-row">
                    <label>الماركة (اختياري)</label>
                    <input type="text" name="make" value="{{ listing['make'] or '' }}">
                </div>
                <div class="form-row">
                    <label>الموديل (اختياري)</label>
                    <input type="text" name="model" value="{{ listing['model'] or '' }}">
                </div>
            </div>

            <div class="form-row">
                <label>الوصف</label>
                <textarea name="description">{{ listing['description'] or '' }}</textarea>
            </div>

            <button type="submit" class="save-btn">💾 حفظ التعديلات</button>
        </form>

        <a href="{{ url_for('my_listings') }}" class="cancel-link">إلغاء والرجوع</a>
    </div>
</main>

</body>
</html>
