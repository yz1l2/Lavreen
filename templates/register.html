<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب | لافريين</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #111827;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 34px;
            font-weight: 900;
            margin-bottom: 8px;
        }

        .logo span {
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dbe1ea;
            border-radius: 13px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 15px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 12px;
            background: #fff1f2;
            color: #be123c;
            margin-bottom: 8px;
        }

        .bottom {
            text-align: center;
            margin-top: 22px;
            color: #6b7280;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="logo"> لاف<span>ريين</span> </div>
        <div class="subtitle"> أنشئ حسابك وابدأ البيع والشراء </div> {% with messages =
        get_flashed_messages(with_categories=true) %} {% if messages %} <div class="messages"> {% for category, message
            in messages %} <div class="message"> {{ message }} </div> {% endfor %} </div> {% endif %} {% endwith %}
        <form method="POST"> <label>الاسم</label> <input type="text" name="name" placeholder="اسمك" required>
            <label>البريد الإلكتروني</label> <input type="email" name="email" placeholder="example@email.com" required>
            <label>كلمة المرور</label> <input type="password" name="password" placeholder="6 أحرف على الأقل"
                minlength="6" required> <label>تأكيد كلمة المرور</label> <input type="password" name="confirm_password"
                placeholder="أعد كتابة كلمة المرور" minlength="6" required> <button type="submit"> إنشاء الحساب
            </button> </form>
        <div class="bottom"> عندك حساب؟ <a href="{{ url_for('login') }}"> تسجيل الدخول </a> </div> <a class="back"
            href="{{ url_for('home') }}"> العودة للرئيسية </a>
    </div>
<!-- شريط التنقل السفلي الخاص بالجوالات -->
<div class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-50 flex justify-around py-3 px-2">
    <a href="/" class="flex flex-col items-center text-gray-600 hover:text-blue-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
        <span class="text-xs mt-1">الرئيسية</span>
    </a>
    <a href="/ai" class="flex flex-col items-center text-gray-600 hover:text-blue-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        <span class="text-xs mt-1">ذكاء اصطناعي</span>
    </a>
    <a href="/sell" class="flex flex-col items-center text-blue-600 font-bold">
        <div class="bg-blue-600 text-white p-2 rounded-full -mt-5 shadow-md">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
        </div>
        <span class="text-xs mt-1">أضف إعلان</span>
    </a>
    <a href="/my-listings" class="flex flex-col items-center text-gray-600 hover:text-blue-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        <span class="text-xs mt-1">إعلاناتي</span>
    </a>
</div>

<!-- مسافة سفلية عشان ما يغطي المحتوى الأخير بالجوال -->
<div class="md:hidden h-16"></div>

</body>
