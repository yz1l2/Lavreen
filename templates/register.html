<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - Lavreen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen py-12">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-md border border-gray-100">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold">حساب جديد في Lavreen ✦</h1>
            <p class="text-gray-500 text-sm mt-1">أنشئ حسابك لتبدأ البيع والشراء</p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 p-3 rounded-xl text-sm mb-4 text-center">{{ error }}</div>
        {% endif %}

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">الاسم الكامل</label>
                <input type="text" name="name" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-black" required>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">البريد الإلكتروني</label>
                <input type="email" name="email" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-black" required>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">كلمة المرور</label>
                <input type="password" name="password" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-black" required>
            </div>
            <div>
                <label class="block text-sm font-semibold mb-1">رقم الجوال (اختياري)</label>
                <input type="text" name="phone" class="w-full p-3 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-black">
            </div>
            <button type="submit" class="w-full bg-black hover:bg-gray-800 text-white p-3 rounded-xl font-bold text-sm transition">إنشاء الحساب</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">لديك حساب بالفعل؟ <a href="/login" class="text-blue-600 font-bold">تسجيل الدخول</a></p>
    </div>
</body>
</html>
