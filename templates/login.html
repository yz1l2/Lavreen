<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول - Lavreen</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            font-family: "Cairo", sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top right,
                    rgba(99, 102, 241, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom left,
                    rgba(14, 165, 233, 0.10),
                    transparent 35%
                ),
                #f8fafc;
        }

        .login-card {
            box-shadow:
                0 25px 60px rgba(15, 23, 42, 0.10),
                0 8px 25px rgba(15, 23, 42, 0.05);
        }

        .input-field {
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .input-field:focus {
            border-color: #6366f1;
            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.10);
            outline: none;
        }

        .login-button {
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow:
                0 10px 25px rgba(79, 70, 229, 0.22);
        }

        .login-button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body class="flex items-center justify-center px-4 py-8">

    <main class="w-full max-w-md">

        <!-- الشعار -->
        <div class="text-center mb-7">

            <a
                href="{{ url_for('index') }}"
                class="inline-flex items-center gap-2"
            >
                <span
                    class="text-4xl font-extrabold tracking-tight text-indigo-600"
                >
                    Lavreen
                </span>
            </a>

            <h1 class="mt-4 text-2xl font-bold text-slate-900">
                تسجيل الدخول
            </h1>

            <p class="mt-1 text-sm text-slate-500">
                ادخل إلى حسابك في لافريين
            </p>

        </div>


        <!-- البطاقة -->
        <section
            class="login-card rounded-3xl bg-white border border-slate-100 p-6 sm:p-8"
        >

            {% if error %}
                <div
                    class="mb-5 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm leading-6 text-red-700"
                    role="alert"
                >
                    {{ error }}
                </div>
            {% endif %}


            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="space-y-5"
            >

                <!-- البريد -->
                <div>

                    <label
                        for="email"
                        class="mb-2 block text-sm font-semibold text-slate-700"
                    >
                        البريد الإلكتروني
                    </label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required
                        value="{{ request.form.get('email', '') }}"
                        placeholder="example@email.com"
                        class="input-field w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm text-slate-900 placeholder-slate-400"
                    >

                </div>


                <!-- كلمة المرور -->
                <div>

                    <div class="mb-2 flex items-center justify-between">

                        <label
                            for="password"
                            class="block text-sm font-semibold text-slate-700"
                        >
                            كلمة المرور
                        </label>

                    </div>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        placeholder="••••••••"
                        class="input-field w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3.5 text-sm text-slate-900 placeholder-slate-400"
                    >

                </div>


                <!-- زر الدخول -->
                <button
                    type="submit"
                    class="login-button w-full rounded-2xl bg-indigo-600 px-5 py-3.5 text-sm font-bold text-white"
                >
                    تسجيل الدخول
                </button>

            </form>


            <!-- التسجيل -->
            <div class="mt-7 border-t border-slate-100 pt-6 text-center">

                <p class="text-sm text-slate-500">
                    ما عندك حساب؟
                    <a
                        href="{{ url_for('register') }}"
                        class="font-bold text-indigo-600 hover:text-indigo-700"
                    >
                        إنشاء حساب جديد
                    </a>
                </p>

            </div>

        </section>


        <!-- العودة -->
        <div class="mt-5 text-center">

            <a
                href="{{ url_for('index') }}"
                class="text-sm font-medium text-slate-500 hover:text-slate-700"
            >
                ← العودة إلى لافريين
            </a>

        </div>

    </main>

</body>
</html>
