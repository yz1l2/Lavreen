<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بيع على Lavreen</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="brand">
        <div class="logo-box">L</div>

        <div>
            <div class="logo-name">Lavreen</div>
            <div class="logo-arabic">لافريين</div>
        </div>
    </div>

    <nav class="nav-links">
        <a href="/">الرئيسية</a>
        <a href="/ai">Lavreen AI ✦</a>
    </nav>

    <div class="nav-buttons">
        <a href="/sell" class="sell-button">بيع الآن</a>
    </div>

</header>


<main class="sell-page">

    <div class="sell-container">

        <div class="sell-heading">

            <small>✦ LAVREEN</small>

            <h1>وش بتبيع؟</h1>

            <p>
                أضف إعلانك وخله يوصل للمشترين بسهولة.
            </p>

        </div>


        <form action="{{ url_for('create_listing') }}"
              method="POST"
              class="sell-form">


            <div class="form-group">

                <label for="title">
                    عنوان الإعلان
                </label>

                <input
                    id="title"
                    type="text"
                    name="title"
                    placeholder="مثال: Toyota Camry 2022"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    الفئة
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">
                        اختر الفئة
                    </option>

                    <option value="سيارات">
                        🚗 سيارات
                    </option>

                    <option value="جوالات">
                        📱 جوالات
                    </option>

                    <option value="كمبيوتر">
                        💻 كمبيوتر
                    </option>

                    <option value="ألعاب">
                        🎮 ألعاب
                    </option>

                    <option value="إلكترونيات">
                        🔌 إلكترونيات
                    </option>

                    <option value="أخرى">
                        📦 أخرى
                    </option>

                </select>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="price">
                        السعر
                    </label>

                    <input
                        id="price"
                        type="number"
                        name="price"
                        placeholder="45000"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="city">
                        المدينة
                    </label>

                    <input
                        id="city"
                        type="text"
                        name="city"
                        placeholder="الرياض"
                        required
                    >

                </div>

            </div>


            <div class="ai-notice">

                <div>✦</div>

                <div>

                    <strong>
                        Lavreen AI
                    </strong>

                    <p>
                        قريبًا بيساعدك الذكاء الاصطناعي في تحسين إعلانك.
                    </p>

                </div>

            </div>


            <div class="form-group">

                <label for="description">
                    وصف الإعلان
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="اكتب تفاصيل الإعلان، الحالة، الممشى، المواصفات..."
                    rows="6"
                ></textarea>

            </div>


            <button
                type="submit"
                class="publish-button"
            >
                نشر الإعلان 🚀
            </button>

        </form>


        <a href="/" class="back-home">
            ← العودة للرئيسية
        </a>

    </div>

</main>


<footer>

    <strong>Lavreen</strong>

    <span>
        منصة البيع والشراء الذكية © 2026
    </span>

</footer>

</body>
</html>
