<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بيع على Lavreen</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="brand">
        <div class="logo-box">L</div>

        <div>
            <div class="logo-name">Lavreen</div>
            <div class="logo-arabic">لافريين</div>
        </div>
    </div>

    <nav class="nav-links">
        <a href="/">الرئيسية</a>
        <a href="/ai">Lavreen AI ✦</a>
    </nav>

    <div class="nav-buttons">
        <a href="/sell" class="sell-button">
            بيع الآن
        </a>
    </div>

</header>

<main class="sell-page">

    <div class="sell-container">

        <div class="sell-heading">
            <small>✦ LAVREEN</small>

            <h1>وش بتبيع؟</h1>

            <p>
                أضف إعلانك وخله يوصل للمشترين بسهولة.
            </p>
        </div>

        <form action="{{ url_for('create_listing') }}"
              method="POST"
              class="sell-form">

            <!-- العنوان -->

            <div class="form-group">

                <label for="title">
                    عنوان الإعلان
                </label>

                <input
                    id="title"
                    type="text"
                    name="title"
                    placeholder="مثال: Toyota Camry 2022"
                    required
                >

            </div>


            <!-- التصنيف الرئيسي -->

            <div class="form-group">

                <label for="main-category">
                    التصنيف
                </label>

                <select id="main-category" required>

                    <option value="">
                        اختر التصنيف
                    </option>

                    <option value="سيارات">🚗 سيارات</option>
                    <option value="حيوانات">🐎 حيوانات</option>
                    <option value="كمبيوتر">💻 كمبيوتر</option>
                    <option value="إلكترونيات">🔌 إلكترونيات</option>
                    <option value="جوالات">📱 جوالات</option>
                    <option value="ألعاب">🎮 ألعاب</option>
                    <option value="عقارات">🏠 عقارات</option>
                    <option value="أثاث">🛋️ أثاث</option>
                    <option value="ملابس">👕 ملابس</option>
                    <option value="دراجات">🏍️ دراجات</option>
                    <option value="معدات وأدوات">🛠️ معدات وأدوات</option>
                    <option value="كتب">📚 كتب</option>
                    <option value="أخرى">📦 أخرى</option>

                </select>

            </div>


            <!-- التصنيف الفرعي -->

            <div class="form-group" id="sub-container" style="display:none;">

                <label for="sub-category">
                    القسم الفرعي
                </label>

                <select id="sub-category">
                    <option value="">
                        اختر القسم
                    </option>
                </select>

            </div>


            <!-- النوع -->

            <div class="form-group" id="type-container" style="display:none;">

                <label for="item-type">
                    النوع / الشركة
                </label>

                <select id="item-type">
                    <option value="">
                        اختر النوع
                    </option>
                </select>

            </div>


            <!-- هذا هو التصنيف الذي سيرسله الموقع للـ Flask -->

            <input type="hidden"
                   id="category"
                   name="category">


            <!-- السعر والمدينة -->

            <div class="form-row">

                <div class="form-group">

                    <label for="price">
                        السعر
                    </label>

                    <input
                        id="price"
                        type="number"
                        name="price"
                        placeholder="45000"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="city">
                        المدينة
                    </label>

                    <input
                        id="city"
                        type="text"
                        name="city"
                        placeholder="الرياض"
                        required
                    >

                </div>

            </div>


            <!-- الوصف -->

            <div class="form-group">

                <label for="description">
                    وصف الإعلان
                </label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="اكتب تفاصيل الإعلان..."
                    rows="6"
                ></textarea>

            </div>


            <button
                type="submit"
                class="publish-button">
                نشر الإعلان 🚀
            </button>

        </form>

        <a href="/" class="back-home">
            ← العودة للرئيسية
        </a>

    </div>

</main>


<footer>

    <span>
        منصة البيع والشراء الذكية ©️ 2026

const mainCategory =
    document.getElementById("main-category");

const subCategory =
    document.getElementById("sub-category");

const itemType =
    document.getElementById("item-type");

const subContainer =
    document.getElementById("sub-container");

const typeContainer =
    document.getElementById("type-container");

const hiddenCategory =
    document.getElementById("category");


function resetSelect(select, text) {

    select.innerHTML =
        '<option value="">' + text + '</option>';

}


mainCategory.addEventListener("change", function () {

    resetSelect(subCategory, "اختر القسم");

    resetSelect(itemType, "اختر النوع");

    subContainer.style.display = "none";
    typeContainer.style.display = "none";

    hiddenCategory.value = this.value;

    const selected = data[this.value];

    if (!selected) {
        return;
    }

    Object.keys(selected).forEach(function (name) {

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        subCategory.appendChild(option);

    });

    subContainer.style.display = "block";

});


subCategory.addEventListener("change", function () {

    resetSelect(itemType, "اختر النوع");

    typeContainer.style.display = "none";

    const main =
        mainCategory.value;

    const sub =
        this.value;

    if (!data[main] || !data[main][sub]) {
        hiddenCategory.value =
            main + " / " + sub;

        return;
    }

    hiddenCategory.value =
        main + " / " + sub;

    data[main][sub].forEach(function (name) {

        const option =
            document.createElement("option");

        option.value = name;
        option.textContent = name;

        itemType.appendChild(option);

    });

    typeContainer.style.display = "block";

});


itemType.addEventListener("change", function () {

    const main =
        mainCategory.value;

    const sub =
        subCategory.value;

    const type =
        this.value;

    hiddenCategory.value =
        main + " / " + sub + " / " + type;

});


document.querySelector(".sell-form").addEventListener("submit", function (event) {

    if (!hiddenCategory.value) {

        event.preventDefault();

        alert("اختر التصنيف أولاً");

        return;
    }

});
