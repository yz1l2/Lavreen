<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>أضف إعلانك - لافريين</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Cairo", sans-serif;
        }

        .sell-page {
            max-width: 850px;
            margin: 0 auto;
            padding: 30px 16px 100px;
        }

        .sell-header {
            margin-bottom: 25px;
        }

        .sell-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
        }

        .sell-header p {
            margin: 5px 0 0;
            opacity: .65;
            font-size: 14px;
        }

        .sell-card {
            border: 1px solid rgba(128,128,128,.18);
            border-radius: 20px;
            padding: 24px;
            background: var(--card-bg, white);
        }

        .error-box {
            background: rgba(220, 38, 38, .08);
            border: 1px solid rgba(220, 38, 38, .35);
            color: #dc2626;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 700;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(128,128,128,.25);
            border-radius: 11px;
            padding: 12px 13px;
            background: transparent;
            color: inherit;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #111827;
        }

        .form-group textarea {
            min-height: 150px;
            resize: vertical;
            line-height: 1.8;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .media-box {
            border: 1.5px dashed rgba(128,128,128,.35);
            border-radius: 15px;
            padding: 22px;
            text-align: center;
            cursor: pointer;
            transition: .2s;
        }

        .media-box:hover {
            background: rgba(128,128,128,.05);
        }

        .media-icon {
            font-size: 35px;
            margin-bottom: 5px;
        }

        .media-box strong {
            display: block;
            font-size: 14px;
        }

        .media-box span {
            display: block;
            margin-top: 4px;
            font-size: 12px;
            opacity: .6;
        }

        #media {
            display: none;
        }

        #preview {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            background: #eee;
        }

        .preview-item img,
        .preview-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-preview {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 25px;
            height: 25px;
            border: 0;
            border-radius: 50%;
            background: rgba(0,0,0,.7);
            color: white;
            cursor: pointer;
            font-size: 13px;
        }

        .submit-btn {
            width: 100%;
            border: 0;
            border-radius: 13px;
            padding: 13px;
            background: #111827;
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .submit-btn:hover {
            opacity: .9;
        }

        .hint {
            font-size: 11px;
            opacity: .6;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .sell-page {
                padding: 20px 10px 80px;
            }

            .sell-card {
                padding: 17px;
                border-radius: 17px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            #preview {
                grid-template-columns: repeat(3, 1fr);
            }

            .sell-header h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<div class="sell-page">

    <div class="sell-header">
        <h1>أضف إعلانك</h1>
        <p>اعرض منتجك أو سيارتك أو عقارك على لافريين</p>
    </div>

    {% if error %}
        <div class="error-box">{{ error }}</div>
    {% endif %}

    <div class="sell-card">

        <form method="POST"
              action="{{ url_for('sell') }}"
              enctype="multipart/form-data">

            <div class="form-group">
                <label for="title">عنوان الإعلان</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="مثال: كامري 2022 للبيع"
                    maxlength="150"
                    required
                >
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="category">القسم</label>

                    <select id="category" name="category" required>
                        <option value="">اختر القسم</option>

                        <option value="سيارات">سيارات</option>
                        <option value="عقار">عقار</option>
                        <option value="جوالات">جوالات</option>
                        <option value="كمبيوتر">كمبيوتر</option>
                        <option value="إلكترونيات">إلكترونيات</option>
                        <option value="أثاث">أثاث</option>
                        <option value="ملابس">ملابس</option>
                        <option value="أخرى">أخرى</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="sub_category">التصنيف الفرعي</label>

                    <select id="sub_category" name="sub_category">
                        <option value="">اختر التصنيف الفرعي</option>
                    </select>
                </div>

            </div>


            <div class="form-group">
                <label for="price">السعر</label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    placeholder="مثال: 60000"
                    min="0"
                    step="0.01"
                    required
                >
            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="city">المدينة</label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="مثال: الرياض"
                        maxlength="80"
                        required
                    >
                </div>


                <div class="form-group">
                    <label for="year">السنة</label>

                    <input
                        type="number"
                        id="year"
                        name="year"
                        placeholder="مثال: 2022"
                        min="1900"
                        max="2100"
                    >
                </div>

            </div>


            <div class="form-row">

                <div class="form-group">
                    <label for="make">الشركة / الماركة</label>

                    <input
                        type="text"
                        id="make"
                        name="make"
                        placeholder="مثال: تويوتا"
                        maxlength="80"
                    >
                </div>


                <div class="form-group">
                    <label for="model">الموديل</label>

                    <input
                        type="text"
                        id="model"
                        name="model"
                        placeholder="مثال: كامري"
                        maxlength="80"
                    >
                </div>

            </div>


            <div class="form-group">
                <label for="mileage">الممشى</label>

                <input
                    type="number"
                    id="mileage"
                    name="mileage"
                    placeholder="مثال: 85000"
                    min="0"
                >

                <div class="hint">
                    للسيارات فقط، اتركه فارغًا إذا كان غير مناسب.
                </div>
            </div>


            <div class="form-group">

                <label for="description">وصف الإعلان</label>

                <textarea
                    id="description"
                    name="description"
                    maxlength="5000"
                    placeholder="اكتب تفاصيل المنتج، حالته، المواصفات، سبب البيع، وأي معلومات مهمة..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label>الصور والفيديو</label>

                <label class="media-box" for="media">

                    <div class="media-icon">📷</div>

                    <strong>اضغط لاختيار الصور أو الفيديوهات</strong>

                    <span>
                        يمكنك اختيار أكثر من ملف
                    </span>

                </label>

                <input
                    type="file"
                    id="media"
                    name="images"
                    accept="image/*,video/*"
                    multiple
                >

                <div id="preview"></div>

            </div>


            <button type="submit" class="submit-btn">
                نشر الإعلان
            </button>

        </form>

    </div>

</div>


<script>
    const category = document.getElementById("category");
    const subCategory = document.getElementById("sub_category");

    const hierarchyData = {
        "سيارات": [
            "سيارات",
            "قطع غيار",
            "دراجات",
            "شاحنات"
        ],

        "عقار": [
            "شقق",
            "فلل",
            "أراضي",
            "عمائر",
            "مكاتب",
            "محلات"
        ],

        "جوالات": [
            "آيفون",
            "سامسونج",
            "أندرويد",
            "أجهزة لوحية",
            "إكسسوارات"
        ],

        "كمبيوتر": [
            "كمبيوتر مكتبي",
            "لابتوب",
            "قطع كمبيوتر",
            "شاشات",
            "إكسسوارات"
        ],

        "إلكترونيات": [
            "تلفزيونات",
            "ألعاب",
            "كاميرات",
            "سماعات",
            "أجهزة منزلية"
        ],

        "أثاث": [
            "غرف نوم",
            "مجالس",
            "كنب",
            "طاولات",
            "مكاتب"
        ],

        "ملابس": [
            "رجالية",
            "نسائية",
            "أطفال",
            "أحذية",
            "إكسسوارات"
        ],

        "أخرى": [
            "أخرى"
        ]
    };


    category.addEventListener("change", function () {

        const selected = this.value;

        subCategory.innerHTML =
            '<option value="">اختر التصنيف الفرعي</option>';

        if (!hierarchyData[selected]) {
            return;
        }

        hierarchyData[selected].forEach(function (item) {

            const option = document.createElement("option");

            option.value = item;
            option.textContent = item;

            subCategory.appendChild(option);

        });

    });


    const mediaInput = document.getElementById("media");
    const preview = document.getElementById("preview");

    mediaInput.addEventListener("change", function () {

        preview.innerHTML = "";

        Array.from(this.files).forEach(function (file) {

            const wrapper = document.createElement("div");
            wrapper.className = "preview-item";

            if (file.type.startsWith("image/")) {

                const img = document.createElement("img");

                img.src = URL.createObjectURL(file);

                wrapper.appendChild(img);

            } else if (file.type.startsWith("video/")) {

                const video = document.createElement("video");

                video.src = URL.createObjectURL(file);
                video.controls = true;

                wrapper.appendChild(video);

            }

            preview.appendChild(wrapper);

        });

    });
</script>

</body>
</html>
